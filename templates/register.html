<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register — LifelineX</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>
        body {
            margin: 0;
            background: #f6f8fb;
            font-family: Arial, sans-serif;
        }

        .auth-page {
            max-width: 520px;
            margin: 60px auto;
            padding: 20px;
        }

        .auth-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.07);
        }

        .auth-card h1 {
            margin-top: 0;
        }

        .auth-card p {
            color: #666;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d9dce3;
            border-radius: 9px;
            font-size: 16px;
        }

        .submit-btn {
            width: 100%;
            border: none;
            background: #d62828;
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            background: #fff0f0;
            border: 1px solid #ffcaca;
            color: #b42318;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 20px;
        }

        .auth-link {
            margin-top: 20px;
        }

        .auth-link a {
            color: #1677ff;
        }
    </style>

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>LifelineX</h1>

        <h2>Create your account</h2>

        <p>
            Join the LifelineX campus emergency response network.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form
            method="POST"
            action="{{ url_for('register') }}"
        >

            <div class="form-group">
                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    placeholder="Enter your full name"
                >
            </div>


            <div class="form-group">
                <label for="student_id">
                    Student ID
                </label>

                <input
                    type="text"
                    id="student_id"
                    name="student_id"
                    required
                    placeholder="Enter your student ID"
                >
            </div>


            <div class="form-group">
                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="Enter your email"
                >
            </div>


            <div class="form-group">
                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    required
                    placeholder="Enter your phone number"
                >
            </div>


            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    minlength="6"
                    placeholder="Create a password"
                >
            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                Create Account
            </button>

        </form>


        <div class="auth-link">

            Already have an account?

            <a href="/login">
                Sign in
            </a>

        </div>


        <div class="auth-link">

            <a href="/">
                ← Back to LifelineX
            </a>

        </div>

    </div>

</div>

</body>
</html>

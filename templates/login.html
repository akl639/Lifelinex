<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In — LifelineX</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>
        body {
            margin: 0;
            background: #f6f8fb;
            font-family: Arial, sans-serif;
        }

        .auth-page {
            max-width: 500px;
            margin: 70px auto;
            padding: 20px;
        }

        .auth-card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.07);
        }

        .auth-card h1 {
            margin-top: 0;
        }

        .auth-card p {
            color: #666;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #d9dce3;
            border-radius: 9px;
            font-size: 16px;
        }

        .submit-btn {
            width: 100%;
            border: none;
            background: #d62828;
            color: white;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            background: #fff0f0;
            border: 1px solid #ffcaca;
            color: #b42318;
            padding: 12px;
            border-radius: 9px;
            margin-bottom: 20px;
        }

        .auth-link {
            margin-top: 20px;
        }

        .auth-link a {
            color: #1677ff;
        }
    </style>

</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>LifelineX</h1>

        <h2>Sign in</h2>

        <p>
            Access your LifelineX emergency profile.
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form
            method="POST"
            action="{{ url_for('login') }}"
        >

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="Enter your email"
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Enter your password"
                >

            </div>


            <button
                type="submit"
                class="submit-btn"
            >
                Sign In
            </button>

        </form>


        <div class="auth-link">

            Don't have an account?

            <a href="/register">
                Create an account
            </a>

        </div>


        <div class="auth-link">

            <a href="/">
                ← Back to LifelineX
            </a>

        </div>

    </div>

</div>

</body>
</html>
